<!DOCTYPE html>
<html lang="en">
<!--
  TO PERSONALIZE:
  1. Replace images/main.jpg with a photo of you two (hero photo)
  2. Add your video as images/video.mp4 (plays on loop after she clicks Yes)
  3. Edit the love note message in the reveal screen
-->
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will you be my Valentine?</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e8365d 0%, #f78da7 50%, #fcb0c4 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Georgia, serif;
      overflow: hidden;
    }

    #ask-screen {
      text-align: center;
      z-index: 2;
      position: relative;
      padding: 2rem;
    }

    #ask-screen h1 {
      font-size: 2.5rem;
      color: white;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
      margin-bottom: 2rem;
    }

    .hero-photo {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      object-fit: cover;
      border: 6px solid white;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      margin-bottom: 2rem;
    }

    .buttons {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 1rem 3rem;
      font-size: 1.4rem;
      font-family: Georgia, serif;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      font-weight: bold;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .btn-yes {
      background: #d4243b;
      color: white;
      box-shadow: 0 4px 16px rgba(212, 36, 59, 0.4);
    }

    .btn-yes:hover {
      box-shadow: 0 6px 24px rgba(212, 36, 59, 0.6);
    }

    .btn-no {
      background: #f8c8d4;
      color: #d4243b;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    .hearts-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      bottom: -10%;
      animation: floatUp linear infinite;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }

    #reveal-screen {
      text-align: center;
      z-index: 2;
      position: relative;
      padding: 2rem;
      max-width: 600px;
    }

    #reveal-screen h1 {
      font-size: 2.5rem;
      color: white;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
      margin-bottom: 0.5rem;
    }

    .love-note {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.9);
      font-style: italic;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .reveal-video {
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      border: 6px solid white;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    .btn-dont-press {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: #d4243b;
      color: white;
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      font-family: Georgia, serif;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 16px rgba(212, 36, 59, 0.4);
      z-index: 10;
      transition: all 0.5s ease;
    }

    .btn-dont-press:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 24px rgba(212, 36, 59, 0.6);
    }

    #surprise-screen {
      text-align: center;
      z-index: 2;
      position: relative;
      padding: 2rem;
    }

    #surprise-screen h1 {
      font-size: 2.5rem;
      color: white;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
      margin-bottom: 2rem;
    }

    .surprise-photo {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      margin: auto;
      max-width: 90vw;
      max-height: 80vh;
      object-fit: contain;
      z-index: 1;
      border-radius: 16px;
      border: 6px solid white;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    #surprise-screen h1 {
      position: fixed;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      background: rgba(0, 0, 0, 0.5);
      padding: 1rem 2rem;
      border-radius: 16px;
      white-space: nowrap;
      text-align: center;
    }

    .surprise-note {
      position: fixed;
      bottom: 5%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      font-size: 1.5rem;
      color: white;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
      background: rgba(0, 0, 0, 0.5);
      padding: 0.8rem 1.5rem;
      border-radius: 16px;
      white-space: nowrap;
      font-weight: bold;
      text-align: center;
    }

    .fade-in {
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      #ask-screen h1, #reveal-screen h1, #surprise-screen h1 {
        font-size: 1.8rem;
      }

      .hero-photo {
        width: 200px;
        height: 200px;
      }

      .btn {
        padding: 0.8rem 2rem;
        font-size: 1.1rem;
      }

      .love-note {
        font-size: 1rem;
        padding: 0 1rem;
      }

      .reveal-video {
        max-width: 300px;
      }
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 0.6;
      }
      to {
        transform: translateY(-110vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="hearts-bg" id="hearts-bg"></div>
  <canvas id="confetti-canvas"></canvas>
  <div id="ask-screen">
    <img src="images/main.jpg" alt="Us" class="hero-photo" />
    <h1>Will you be my Valentine?</h1>
    <div class="buttons">
      <button class="btn btn-yes" id="yes-btn">Yes</button>
      <button class="btn btn-no" id="no-btn">No</button>
    </div>
  </div>
  <div id="reveal-screen" style="display: none;">
    <h1 class="fade-in">HAHAHAHA YOU SAID YES!</h1>
    <p class="love-note fade-in" style="animation-delay: 0.3s; opacity: 0;">
      You make every day feel like Valentine's Day. I love you! &#10084;
    </p>
    <video class="reveal-video fade-in" style="animation-delay: 0.6s; opacity: 0;" id="reveal-video" loop muted playsinline>
      <source src="images/video.mp4" type="video/mp4">
    </video>
    <button class="btn btn-dont-press fade-in" style="animation-delay: 1.2s; opacity: 0;" id="dont-press-btn">DON'T PRESS ME</button>
  </div>
  <div id="surprise-screen" style="display: none;">
    <h1 class="fade-in">SEE YOU LATER BABE!!!!</h1>
    <p class="surprise-note fade-in" style="animation-delay: 0.2s; opacity: 0;">I LOVE YOU SOOOOOOOOOO MUCH</p>
    <img src="images/surprise.jpg" alt="Surprise!" class="surprise-photo fade-in" style="animation-delay: 0.4s; opacity: 0;" />
  </div>
  <script>
    (function () {
      var noBtn = document.getElementById('no-btn');
      var escapeCount = 0;
      var messages = ['No', 'Nope!', 'Not happening!', 'Try again!', 'Too slow!', 'Hehe!', 'Never!', 'Give up!'];

      function getRandomPosition() {
        var margin = escapeCount < 3 ? 20 : 10;
        var btnWidth = noBtn.offsetWidth || 120;
        var btnHeight = noBtn.offsetHeight || 50;
        var maxX = window.innerWidth - btnWidth - margin;
        var maxY = window.innerHeight - btnHeight - margin;
        var x = Math.random() * (maxX - margin) + margin;
        var y = Math.random() * (maxY - margin) + margin;
        return { x: x, y: y };
      }

      function runAway() {
        escapeCount++;
        var pos = getRandomPosition();
        noBtn.style.position = 'fixed';
        noBtn.style.left = pos.x + 'px';
        noBtn.style.top = pos.y + 'px';
        noBtn.style.zIndex = '100';

        if (escapeCount > 3) {
          noBtn.style.transition = 'none';
        }

        var msgIndex = Math.min(escapeCount, messages.length - 1);
        noBtn.textContent = messages[msgIndex];
      }

      noBtn.addEventListener('mouseenter', runAway);
      noBtn.addEventListener('touchstart', function (e) {
        e.preventDefault();
        runAway();
      }, { passive: false });

      // Floating hearts
      var heartsBg = document.getElementById('hearts-bg');
      var heartChars = ['\u2764', '\uD83D\uDC96', '\uD83D\uDC97', '\uD83D\uDC95', '\u2665'];
      for (var i = 0; i < 20; i++) {
        var span = document.createElement('span');
        span.className = 'floating-heart';
        span.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];
        span.style.left = Math.random() * 100 + '%';
        span.style.fontSize = (Math.random() * 1.5 + 0.8) + 'rem';
        span.style.animationDuration = (Math.random() * 6 + 6) + 's';
        span.style.animationDelay = (Math.random() * 8) + 's';
        span.style.opacity = (Math.random() * 0.4 + 0.2);
        heartsBg.appendChild(span);
      }

      // Confetti hearts burst
      function launchConfetti() {
        var canvas = document.getElementById('confetti-canvas');
        var ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        var colors = ['#e8365d', '#f78da7', '#ff4081', '#ff80ab', '#ffffff', '#d4243b'];
        var particles = [];
        var centerX = canvas.width / 2;
        var centerY = canvas.height / 2;

        for (var i = 0; i < 120; i++) {
          particles.push({
            x: centerX,
            y: centerY,
            vx: Math.random() * 20 - 10,
            vy: Math.random() * 20 - 10 - 5,
            size: Math.random() * 12 + 6,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * Math.PI * 2,
            rotationSpeed: Math.random() * 0.2 - 0.1,
            opacity: 1,
            gravity: 0.15
          });
        }

        function drawHeart(x, y, size, color, rotation, opacity) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(rotation);
          ctx.globalAlpha = opacity;
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(0, -size / 4);
          ctx.bezierCurveTo(size / 2, -size, size, -size / 4, 0, size / 2);
          ctx.moveTo(0, -size / 4);
          ctx.bezierCurveTo(-size / 2, -size, -size, -size / 4, 0, size / 2);
          ctx.fill();
          ctx.restore();
        }

        var frame = 0;

        function animate() {
          frame++;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          var alive = false;

          for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            if (p.opacity <= 0) continue;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.rotation += p.rotationSpeed;
            p.opacity -= 0.008;
            if (p.opacity < 0) p.opacity = 0;
            if (p.opacity > 0) {
              alive = true;
              drawHeart(p.x, p.y, p.size, p.color, p.rotation, p.opacity);
            }
          }

          if (alive && frame < 300) {
            requestAnimationFrame(animate);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        }

        animate();
      }

      // Don't press me button - cycle corners
      var dontPressBtn = document.getElementById('dont-press-btn');
      var cornerIndex = 0;
      var cornerTimer = null;

      function cycleCorner() {
        cornerIndex = (cornerIndex + 1) % 4;
        dontPressBtn.style.top = (cornerIndex < 2) ? '1.5rem' : 'auto';
        dontPressBtn.style.bottom = (cornerIndex >= 2) ? '1.5rem' : 'auto';
        dontPressBtn.style.left = (cornerIndex === 1 || cornerIndex === 2) ? '1.5rem' : 'auto';
        dontPressBtn.style.right = (cornerIndex === 0 || cornerIndex === 3) ? '1.5rem' : 'auto';
      }

      function startCornerCycle() {
        cornerTimer = setInterval(cycleCorner, 2000);
      }

      document.getElementById('dont-press-btn').addEventListener('click', function() {
        clearInterval(cornerTimer);
        document.getElementById('reveal-screen').style.display = 'none';
        document.getElementById('reveal-video').pause();
        document.getElementById('dont-press-btn').style.display = 'none';
        document.getElementById('surprise-screen').style.display = 'block';
      });

      // Yes button handler
      document.getElementById('yes-btn').addEventListener('click', function() {
        launchConfetti();
        document.getElementById('no-btn').style.display = 'none';
        setTimeout(function() {
          document.getElementById('ask-screen').style.display = 'none';
          document.getElementById('reveal-screen').style.display = 'block';
          document.getElementById('reveal-video').play();
          startCornerCycle();
        }, 800);
      });
    })();
  </script>
</body>
</html>
